name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09fc1-amamammaa
    paths:
      - 'yoru-android/app/**'
      - 'yoru-android/settings.gradle'
      - 'yoru-android/build.gradle'
      - 'yoru-android/gradle.properties'
      - 'yoru-android/gradle/**'
      - 'yoru-android/gradlew'
      - 'yoru-android/gradlew.bat'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: yoru-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: yoru-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            yoru-android/*.gradle
            yoru-android/**/*.gradle
            yoru-android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
      - name: Restore Android SDK cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/platform-tools
          key: yoru-android-sdk-36-36.0.0-${{ runner.os }}
      - name: Install missing Android SDK components
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          else
            echo "Android SDK 36 already restored"
          fi
      - name: Verify release signing files
        run: |
          if [ ! -f owner-signing/yoru-release.p12 ] || [ ! -f owner-signing/signing.properties ] || [ ! -f owner-signing/certificate-sha256.txt ]; then
            echo "::error title=Signing files missing::owner-signing files are missing from the repository."
            exit 1
          fi
      - name: Build Java release APK
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee ../build-release.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Java release build failed"
              echo '```'
              grep -nE "error:|warning: \[|FAILURE|Caused by|What went wrong|Could not" ../build-release.log | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -B1 -A3 -E "error:|FAILURE|Could not resolve|Could not find|What went wrong" ../build-release.log | head -160 > ../build-error.log
            while IFS= read -r line; do
              msg=$(printf '%.300s' "$line" | sed 's/%/%25/g')
              echo "::error::$msg"
            done < ../build-error.log
            mkdir -p apk-output
            cp ../build-error.log apk-output/build-error.log
            git add apk-output/build-error.log
            git commit -m "CI: build errors [skip ci]" >/dev/null 2>&1
            git push origin "HEAD:$GITHUB_REF_NAME" >/dev/null 2>&1 || true
            exit "$code"
          fi
      - name: Verify APK signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Check APK size budget
        run: |
          size=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK size: $size bytes"
          if [ "$size" -gt 8388608 ]; then
            echo "::error title=APK too large::Release APK is $size bytes, budget is 8 MB."
            exit 1
          fi
      - name: Save APK into branch
        working-directory: .
        run: |
          git pull --rebase origin arena/01a09fc1-amamammaa
          mkdir -p apk-output
          rm -f apk-output/YORU-4.20.0-release.apk apk-output/YORU-4.20.0-release.apk.sha256 apk-output/YORU-4.20.0-debug.apk apk-output/YORU-4.20.0-debug.apk.sha256 apk-output/build-error.log
          cp yoru-android/app/build/outputs/apk/release/app-release.apk apk-output/YORU-4.20.0-release.apk
          sha256sum apk-output/YORU-4.20.0-release.apk > apk-output/YORU-4.20.0-release.apk.sha256
          cp yoru-android/app/build/outputs/apk/debug/app-debug.apk apk-output/YORU-4.20.0-debug.apk
          sha256sum apk-output/YORU-4.20.0-debug.apk > apk-output/YORU-4.20.0-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk-output/YORU-4.20.0-*.apk apk-output/YORU-4.20.0-*.apk.sha256
          git add -u apk-output/build-error.log 2>/dev/null || true
          git commit -m "Add built YORU 4.20.0 release APK [skip ci]" || exit 0
          git push origin HEAD:arena/01a09fc1-amamammaa
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoru-4.20.0-release-apk
          path: |
            apk-output/YORU-4.20.0-*.apk
            apk-output/YORU-4.20.0-*.apk.sha256
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-4.20.0-tests
          path: yoru-android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-4.20.0-build-log
          path: build-release.log
          if-no-files-found: ignore
